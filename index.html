<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Number Notebook Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signOut,
            GoogleAuthProvider,
            signInWithPopup,
            setPersistence,
            browserLocalPersistence,
            signInWithCredential
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        
        import { 
            getFirestore, 
            doc, 
            onSnapshot, 
            setDoc, 
            collection,
            query,
            orderBy,
            limit,
            serverTimestamp,
            deleteDoc,
            enableIndexedDbPersistence,
            addDoc,
            updateDoc,
            arrayRemove
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const FIREBASE_APP_CONFIG = {
           apiKey: "AIzaSyCsNuUcV4U67P8TwgGZGzmFjhUkRwZ6QjM",
           authDomain: "notebook-463e4.firebaseapp.com",
           projectId: "notebook-463e4",
           storageBucket: "notebook-463e4.firebasestorage.app",
           messagingSenderId: "885400424886",
           appId: "1:885400424886:web:c419ab84a16d7e433fb117"
        };
        
        const appId = "number-notebook-v1";
        const TARGET_ID = "default-1765467211811"; 
        const TARGET_NAME = "Primary Notebook";

        let app, auth, db, userId, googleProvider;
        let notebooks = [];
        let currentNotebookId = null;
        let entriesUnsubscribe = null;
        let legacyEntries = [];

        const notebookSelect = document.getElementById('notebookSelect');
        const entryList = document.getElementById('entryList');
        const newEntryInput = document.getElementById('newEntryInput');
        const totalSumDisplay = document.getElementById('totalSum');
        const signOutBtn = document.getElementById('signOutBtn');
        const appUi = document.getElementById('appUi');
        const authGate = document.getElementById('authGate');
        const signInBtn = document.getElementById('signInBtn');
        const signInError = document.getElementById('signInError');
        const currentUserIdDisplay = document.getElementById('currentUserIdDisplay');
        const syncStatus = document.getElementById('syncStatus');
        const addEntryBtn = document.getElementById('addEntryBtn');

        async function setupFirebase() {
            try {
                app = initializeApp(FIREBASE_APP_CONFIG);
                auth = getAuth(app);
                db = getFirestore(app);
                googleProvider = new GoogleAuthProvider();

                try {
                    await enableIndexedDbPersistence(db);
                } catch (err) {
                    console.warn("Persistence failed:", err.code);
                }

                await setPersistence(auth, browserLocalPersistence);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        currentUserIdDisplay.textContent = user.email || "Signed In";
                        appUi.classList.remove('hidden');
                        authGate.classList.add('hidden');
                        listenToNotebooks();
                    } else {
                        appUi.classList.add('hidden');
                        authGate.classList.remove('hidden');
                        if (entriesUnsubscribe) entriesUnsubscribe();
                    }
                });
            } catch (error) {
                signInError.textContent = "Auth Error: Check Console";
            }
        }

        function listenToNotebooks() {
            const notebooksRef = collection(db, 'artifacts', appId, 'users', userId, 'notebooks');
            onSnapshot(notebooksRef, async (snapshot) => {
                notebooks = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                
                const targetNb = notebooks.find(n => n.id === TARGET_ID);
                if (targetNb && targetNb.name !== TARGET_NAME) {
                    const nbDoc = doc(db, 'artifacts', appId, 'users', userId, 'notebooks', TARGET_ID);
                    await updateDoc(nbDoc, { name: TARGET_NAME });
                }

                if (notebooks.length === 0) {
                    createDefaultNotebook();
                    return;
                }

                if (!currentNotebookId || !notebooks.some(n => n.id === currentNotebookId)) {
                    currentNotebookId = notebooks[0].id;
                }

                renderNotebooks();
                listenToEntries();
            });
        }

        function listenToEntries() {
            if (entriesUnsubscribe) entriesUnsubscribe();
            if (!currentNotebookId) return;

            const activeNotebook = notebooks.find(n => n.id === currentNotebookId);
            legacyEntries = activeNotebook?.entries || [];

            const entriesRef = collection(db, 'artifacts', appId, 'users', userId, 'notebooks', currentNotebookId, 'entries');
            const q = query(entriesRef, orderBy('timestamp', 'desc'), limit(100));

            entriesUnsubscribe = onSnapshot(q, (snapshot) => {
                const newEntries = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                const legacyWithFlags = legacyEntries.map(e => ({ ...e, isLegacy: true }));
                const combined = [...newEntries, ...legacyWithFlags].sort((a, b) => b.timestamp - a.timestamp);
                
                renderEntries(combined);
                
                const isOffline = snapshot.metadata.fromCache;
                syncStatus.textContent = isOffline ? "⚡ Offline" : "☁️ Synced";
                syncStatus.className = isOffline ? "text-orange-500 font-bold" : "text-green-500 font-bold";
            });
        }

        async function createDefaultNotebook() {
            const notebooksRef = collection(db, 'artifacts', appId, 'users', userId, 'notebooks');
            await addDoc(notebooksRef, {
                name: "Primary Ledger",
                createdAt: serverTimestamp()
            });
        }

        async function addEntry() {
            const val = parseFloat(newEntryInput.value);
            if (isNaN(val) || val === 0 || !currentNotebookId) return;

            const entriesRef = collection(db, 'artifacts', appId, 'users', userId, 'notebooks', currentNotebookId, 'entries');
            newEntryInput.value = '';
            newEntryInput.focus();

            try {
                await addDoc(entriesRef, {
                    value: val,
                    timestamp: Date.now(),
                    serverTime: serverTimestamp()
                });
            } catch (e) {
                console.error("Cloud sync failed:", e);
            }
        }

        async function deleteEntry(id, timestamp, isLegacy) {
            if (!confirm("Delete this entry?")) return;
            
            if (isLegacy) {
                const notebookDoc = doc(db, 'artifacts', appId, 'users', userId, 'notebooks', currentNotebookId);
                const activeNotebook = notebooks.find(n => n.id === currentNotebookId);
                const entryToRemove = activeNotebook.entries.find(e => e.timestamp === timestamp);
                await updateDoc(notebookDoc, {
                    entries: arrayRemove(entryToRemove)
                });
            } else {
                const entryDoc = doc(db, 'artifacts', appId, 'users', userId, 'notebooks', currentNotebookId, 'entries', id);
                await deleteDoc(entryDoc);
            }
        }

        async function createNewNotebook() {
            const name = prompt("Notebook Name:");
            if (!name?.trim()) return;
            const notebooksRef = collection(db, 'artifacts', appId, 'users', userId, 'notebooks');
            const docRef = await addDoc(notebooksRef, {
                name: name.trim(),
                createdAt: serverTimestamp()
            });
            currentNotebookId = docRef.id;
        }

        // Exposed to window for legacy support if needed, though we use programmatic listeners now
        window.deleteEntry = deleteEntry;
        window.createNewNotebook = createNewNotebook;

        function renderNotebooks() {
            notebookSelect.innerHTML = '';
            notebooks.forEach(nb => {
                const opt = document.createElement('option');
                opt.value = nb.id;
                opt.textContent = nb.name;
                opt.selected = nb.id === currentNotebookId;
                notebookSelect.appendChild(opt);
            });
            const active = notebooks.find(n => n.id === currentNotebookId);
            document.getElementById('nbTitle').textContent = active ? active.name : "Select Notebook";
        }

        function renderEntries(entries) {
            entryList.innerHTML = '';
            let sum = 0;
            entries.forEach(e => {
                sum += e.value;
                const li = document.createElement('li');
                li.className = "flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-transparent hover:border-indigo-100 transition mb-3";
                li.innerHTML = `
                    <div>
                        <div class="text-xl font-black text-slate-800">$${e.value.toFixed(2)}</div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${new Date(e.timestamp).toLocaleString()}</div>
                    </div>
                    <button onclick="deleteEntry('${e.id || ''}', ${e.timestamp}, ${!!e.isLegacy})" class="text-slate-300 hover:text-red-500 p-2 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                `;
                entryList.appendChild(li);
            });
            totalSumDisplay.textContent = `$${sum.toFixed(2)}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            setupFirebase();
            
            // Programmatic listeners - The "Pro" way
            signInBtn.addEventListener('click', async () => {
                try { await signInWithPopup(auth, googleProvider); } 
                catch (e) { signInError.textContent = e.message; }
            });

            signOutBtn.addEventListener('click', () => signOut(auth));
            
            addEntryBtn.addEventListener('click', addEntry);

            newEntryInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    addEntry();
                }
            });

            notebookSelect.addEventListener('change', (e) => {
                currentNotebookId = e.target.value;
                listenToEntries();
            });
        });
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-indigo-100 antialiased">

    <div class="min-h-screen flex flex-col max-w-lg mx-auto bg-white shadow-[0_0_50px_rgba(0,0,0,0.1)] relative overflow-hidden">
        
        <!-- Auth Gate -->
        <div id="authGate" class="absolute inset-0 z-50 bg-white flex flex-col items-center justify-center p-10 text-center hidden">
            <div class="w-24 h-24 bg-indigo-600 rounded-[2.5rem] flex items-center justify-center mb-8 shadow-2xl shadow-indigo-200 rotate-6">
                <span class="text-white text-5xl font-black italic">#</span>
            </div>
            <h1 class="text-4xl font-black tracking-tight mb-3">Keeper <span class="text-indigo-600 text-lg align-top uppercase tracking-widest ml-1">Pro</span></h1>
            <p class="text-slate-400 font-medium mb-12 leading-relaxed">Your professional cloud ledger.<br>Fast, secure, and always in sync.</p>
            <button id="signInBtn" class="w-full py-5 bg-slate-900 text-white rounded-3xl font-black hover:bg-indigo-600 transition-all flex items-center justify-center space-x-4 active:scale-[0.98] shadow-xl shadow-slate-200">
                <svg class="w-6 h-6" viewBox="0 0 48 48"><path fill="#FFF" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/></svg>
                <span class="text-lg">Continue with Google</span>
            </button>
            <p id="signInError" class="mt-6 text-sm text-red-500 font-bold uppercase tracking-widest"></p>
        </div>

        <!-- App UI -->
        <div id="appUi" class="flex-1 flex flex-col hidden">
            <header class="px-8 pt-10 pb-6 flex justify-between items-end">
                <div>
                    <div id="syncStatus" class="text-[10px] font-black uppercase tracking-[0.3em] mb-2">Syncing...</div>
                    <h2 id="nbTitle" class="text-3xl font-black truncate max-w-[240px] tracking-tight text-slate-800">...</h2>
                </div>
                <button id="signOutBtn" class="mb-1 text-[10px] font-black bg-slate-100 text-slate-400 px-4 py-2 rounded-full hover:bg-red-50 hover:text-red-600 transition tracking-widest">LOGOUT</button>
            </header>

            <div class="px-8 mb-8">
                <div class="flex space-x-3">
                    <div class="flex-1 relative">
                        <select id="notebookSelect" class="w-full bg-slate-100 border-none rounded-[1.25rem] py-4 px-5 font-black text-slate-700 text-sm focus:ring-2 focus:ring-indigo-500 appearance-none cursor-pointer">
                            <!-- Options -->
                        </select>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
                        </div>
                    </div>
                    <button onclick="createNewNotebook()" class="aspect-square bg-indigo-600 text-white rounded-[1.25rem] flex items-center justify-center px-5 hover:bg-indigo-700 shadow-xl shadow-indigo-100 active:scale-90 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M12 6v12m6-6H6"/></svg>
                    </button>
                </div>
            </div>

            <div class="px-8 mb-8">
                <div class="bg-slate-900 rounded-[2.5rem] p-10 text-white shadow-2xl shadow-slate-200 relative overflow-hidden group">
                    <div class="relative z-10">
                        <span class="text-[10px] font-black opacity-40 uppercase tracking-[0.4em] block mb-4">Total Balance</span>
                        <div id="totalSum" class="text-6xl font-black text-white tracking-tighter tabular-nums">$0.00</div>
                    </div>
                    <div class="absolute -right-12 -bottom-12 w-48 h-48 bg-indigo-500 rounded-full blur-[70px] opacity-20 group-hover:opacity-40 transition-opacity"></div>
                </div>
            </div>

            <div class="px-8 mb-10">
                <div class="relative flex items-center">
                    <input type="text" id="newEntryInput" placeholder="0.00" inputmode="decimal"
                           class="w-full p-8 pr-32 bg-white border-4 border-slate-50 rounded-[2.5rem] text-4xl font-black focus:border-indigo-500 focus:ring-0 transition-all shadow-sm placeholder:text-slate-200">
                    <button id="addEntryBtn" class="absolute right-3 top-3 bottom-3 px-10 bg-green-500 text-white font-black rounded-[2rem] hover:bg-green-600 active:scale-95 transition shadow-lg shadow-green-100 text-lg">
                        ADD
                    </button>
                </div>
            </div>

            <div class="flex-1 px-8 pb-10 overflow-hidden flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-300">History</h3>
                    <div class="h-px flex-1 bg-slate-50 ml-4"></div>
                </div>
                <div class="flex-1 overflow-y-auto hide-scroll">
                    <ul id="entryList"></ul>
                </div>
            </div>

            <footer class="px-8 py-6 border-t border-slate-50 flex justify-between items-center text-[10px] font-black text-slate-300 tracking-widest uppercase">
                <span id="currentUserIdDisplay">...</span>
                <span>Production Build v2.2</span>
            </footer>
        </div>
    </div>
</body>
</html>
