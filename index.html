<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Notebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signOut,
            GoogleAuthProvider,
            signInWithPopup,
            setPersistence,
            browserLocalPersistence,
            signInWithCredential
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { a
            getFirestore, 
            doc, 
            onSnapshot, 
            setDoc, 
            collection,
            query, 
            where, 
            getDocs,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // IMPORTANT: Set log level for debugging Firebase operations
        setLogLevel('debug');
        
        let app;
        let auth;
        let db;
        let userId = null;
        let notebooksRef = null;
        let googleProvider;

        // --- CONFIGURATION ---
        
        // 🚨 ACTION REQUIRED: Replace these placeholder values with your ACTUAL 
        // Firebase Web App credentials from your console.
        const MY_FIREBASE_CONFIG = {
           apiKey: "YOUR_API_KEY_HERE",
           authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
           projectId: "YOUR_PROJECT_ID",
           storageBucket: "YOUR_PROJECT_ID.appspot.com",
           messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
           appId: "YOUR_APP_ID"
        };
        
        // --- APP STATE ---
        const appId = "number-notebook-v1"; // Fixed App Identifier for Firestore path
        let notebooks = [];
        let currentNotebookId = null;

        // --- DOM ELEMENTS ---
        const notebookSelect = document.getElementById('notebookSelect');
        const entryList = document.getElementById('entryList');
        const newEntryInput = document.getElementById('newEntryInput');
        const totalSumDisplay = document.getElementById('totalSum');
        const signOutBtn = document.getElementById('signOutBtn');
        const appUi = document.getElementById('appUi');
        const authGate = document.getElementById('authGate');
        const signInBtn = document.getElementById('signInBtn');
        const signInError = document.getElementById('signInError');
        const currentUserIdDisplay = document.getElementById('currentUserIdDisplay');
        const notebookContainer = document.getElementById('notebookContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');

        // --- FIREBASE INITIALIZATION AND AUTH ---

        function updateAuthStatus(user) {
            if (user) {
                userId = user.uid;
                notebooksRef = collection(db, 'artifacts', appId, 'users', userId, 'notebooks');
                currentUserIdDisplay.textContent = `User: ${user.email || 'Permanent Session'}`;
                
                // We assume any successful login (including Google) is permanent.
                signOutBtn.classList.remove('hidden');

                appUi.classList.remove('hidden');
                authGate.classList.add('hidden');
                
                // Start listening for data only after successful authentication
                startDataListener();

            } else {
                userId = null;
                currentUserIdDisplay.textContent = 'Status: Not Signed In';
                notebooksRef = null;
                appUi.classList.add('hidden');
                authGate.classList.remove('hidden');
                notebooks = []; // Clear local data
                currentNotebookId = null;
                renderEntryList();
                renderNotebooks();
            }
        }

        async function setupFirebase() {
            try {
                app = initializeApp(MY_FIREBASE_CONFIG);
                auth = getAuth(app);
                db = getFirestore(app);
                googleProvider = new GoogleAuthProvider(); // Initialize Google provider
                setPersistence(auth, browserLocalPersistence); // Always set persistence

                loadingIndicator.textContent = "Connecting to cloud...";
                loadingIndicator.classList.remove('hidden');
                
                // Listen for auth state changes (handles auto-login on refresh)
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        updateAuthStatus(user);
                        loadingIndicator.classList.add('hidden');
                    } else {
                        loadingIndicator.classList.add('hidden');
                        updateAuthStatus(null);
                    }
                });
                
            } catch (error) {
                console.error("Firebase Initialization Error:", error);
                loadingIndicator.textContent = `Initialization Error: ${error.message}`;
            }
        }

        async function handleSignOut() {
            try {
                await signOut(auth);
                // onAuthStateChanged will handle the UI update
            } catch (error) {
                console.error("Sign Out Error:", error);
            }
        }
        
        async function handleGoogleSignIn() {
            signInBtn.disabled = true;
            signInError.textContent = '';
            
            try {
                signInError.textContent = "Signing in...";
                
                // 1. Set persistence (already done in setup, but harmless to repeat)
                await setPersistence(auth, browserLocalPersistence);
                
                // 2. Perform the sign-in with a pop-up
                await signInWithPopup(auth, googleProvider);
                
                // The onAuthStateChanged listener handles the rest.
                
            } catch (error) {
                // Check if the credential is already in use (the scenario we fixed before)
                if (error.code === 'auth/credential-already-in-use' && error.credential) {
                    try {
                        signInError.textContent = "Switching to existing permanent account...";
                        // Sign the user into the existing permanent account
                        await signInWithCredential(auth, error.credential);
                        // The onAuthStateChanged listener handles the rest.
                        return;
                    } catch (reauthError) {
                        console.error("Failed to sign in with existing credential:", reauthError);
                        signInError.textContent = "Error switching accounts. Try clearing site data.";
                    }
                }
                
                // Handle the common error when the user cancels the pop-up
                if (error.code === 'auth/popup-closed-by-user') {
                    signInError.textContent = "Sign in cancelled.";
                } else if (error.code === 'auth/cancelled-popup-request') {
                     signInError.textContent = "Sign in attempt cancelled.";
                } else {
                    signInError.textContent = `Sign In Failed: ${error.message}`;
                    console.error("Google Sign-In Error:", error);
                }
            } finally {
                signInBtn.disabled = false;
            }
        }


        // --- FIRESTORE DATA HANDLING ---

        function getNotebookPath(id) {
            return doc(notebooksRef, id);
        }

        function getCurrentNotebook() {
            return notebooks.find(nb => nb.id === currentNotebookId);
        }

        async function saveNotebooksToFirestore(notebooksToSave) {
            if (!userId) return; // Should not happen if UI is visible
            
            // Save the list of notebooks metadata (names, IDs)
            await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'metadata', 'notebookList'), { list: notebooksToSave.map(n => ({ id: n.id, name: n.name })) });

            // Save the current state of ALL notebooks (content)
            for (const notebook of notebooksToSave) {
                await setDoc(getNotebookPath(notebook.id), { entries: notebook.entries, name: notebook.name });
            }
        }

        function createDefaultNotebook() {
            const defaultId = `default-${Date.now()}`;
            const defaultNotebook = {
                id: defaultId,
                name: "Primary Notebook",
                entries: []
            };
            notebooks.push(defaultNotebook);
            currentNotebookId = defaultId;
            saveNotebooksToFirestore(notebooks); // Trigger initial save
        }

        // --- REAL-TIME DATA LISTENER ---

        function startDataListener() {
            if (!notebooksRef) return;

            // 1. Listen for the list of Notebook IDs (metadata)
            const listDocRef = doc(db, 'artifacts', appId, 'users', userId, 'metadata', 'notebookList');
            onSnapshot(listDocRef, (docSnapshot) => {
                const listData = docSnapshot.data();
                if (listData && listData.list && listData.list.length > 0) {
                    const listIds = listData.list.map(item => item.id);
                    // 2. Listen to individual notebook data for all found IDs
                    listIds.forEach(id => listenToNotebookContent(id));
                    
                    // Set up local state for new or deleted notebooks
                    notebooks = listData.list.map(item => notebooks.find(n => n.id === item.id) || { id: item.id, name: item.name, entries: [] });
                    
                    if (!currentNotebookId || !notebooks.some(n => n.id === currentNotebookId)) {
                         currentNotebookId = listIds[0];
                    }
                    renderNotebooks();
                    renderEntryList();
                } else if (!docSnapshot.exists() && notebooks.length === 0) {
                    // Create default only if metadata doesn't exist and we have no local state
                    createDefaultNotebook();
                }
            }, (error) => {
                console.error("Error fetching notebook list:", error);
                totalSumDisplay.textContent = `Error connecting to cloud. Did you set Firestore Rules?`;
            });
        }
        
        function listenToNotebookContent(id) {
            const notebookDocRef = getNotebookPath(id);
            onSnapshot(notebookDocRef, (docSnapshot) => {
                const data = docSnapshot.data();
                if (data) {
                    const existingNotebook = notebooks.find(n => n.id === id);
                    if (existingNotebook) {
                        existingNotebook.entries = data.entries || [];
                        existingNotebook.name = data.name || existingNotebook.name;
                    } else {
                        // This should be handled by the list listener, but acts as a fallback
                        notebooks.push({ id, name: data.name, entries: data.entries || [] });
                    }
                    if (id === currentNotebookId) {
                        renderEntryList();
                    }
                    renderNotebooks(); // In case name changed
                }
            }, (error) => {
                console.error(`Error fetching notebook ${id}:`, error);
            });
        }

        // --- RENDER FUNCTIONS ---

        function calculateTotalSum(entries) {
            return entries.reduce((sum, entry) => sum + entry.value, 0).toFixed(2);
        }

        function renderNotebooks() {
            notebookSelect.innerHTML = '';
            
            notebooks.forEach(nb => {
                const option = document.createElement('option');
                option.value = nb.id;
                option.textContent = nb.name;
                option.selected = nb.id === currentNotebookId;
                notebookSelect.appendChild(option);
            });

            // Display current notebook name in the header
            const currentNb = getCurrentNotebook();
            if(currentNb) {
                 notebookContainer.querySelector('h2').textContent = currentNb.name;
            }
        }

        function renderEntryList() {
            entryList.innerHTML = '';
            const currentNb = getCurrentNotebook();
            
            if (!currentNb) {
                totalSumDisplay.textContent = '0.00';
                return;
            }

            currentNb.entries.forEach(entry => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center py-2 border-b last:border-b-0 text-lg';
                
                // Value and Timestamp
                const entryContent = document.createElement('span');
                entryContent.className = 'flex-1 flex flex-col sm:flex-row sm:justify-between';
                
                const valueSpan = document.createElement('span');
                valueSpan.className = 'font-bold text-gray-800';
                valueSpan.textContent = `$${entry.value.toFixed(2)}`;
                
                const timeSpan = document.createElement('span');
                timeSpan.className = 'text-sm text-gray-500 mt-0.5 sm:mt-0';
                timeSpan.textContent = new Date(entry.timestamp).toLocaleString();

                entryContent.appendChild(valueSpan);
                entryContent.appendChild(timeSpan);
                li.appendChild(entryContent);

                // Delete button
                const deleteButton = document.createElement('button');
                deleteButton.className = 'ml-4 p-2 text-red-500 hover:text-red-700 transition duration-150 rounded-full hover:bg-red-50';
                deleteButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 10-2 0v6a1 1 0 102 0V8z" clip-rule="evenodd" /></svg>`;
                deleteButton.onclick = () => handleDeleteEntry(entry.timestamp);
                li.appendChild(deleteButton);

                entryList.appendChild(li);
            });

            totalSumDisplay.textContent = calculateTotalSum(currentNb.entries);
        }

        // --- USER ACTIONS ---

        function handleSelectNotebook(event) {
            currentNotebookId = event.target.value;
            renderEntryList();
        }

        function handleAddEntry() {
            const valueStr = newEntryInput.value.trim();
            const value = parseFloat(valueStr);

            if (isNaN(value) || value === 0) {
                newEntryInput.value = '';
                return;
            }
            
            const currentNb = getCurrentNotebook();
            if (!currentNb) return;
            
            const newEntry = {
                value: value,
                timestamp: Date.now() 
            };
            
            // Add entry to the beginning (LIFO for display)
            currentNb.entries.unshift(newEntry);
            newEntryInput.value = '';
            newEntryInput.focus();
            
            // Push update to Firestore
            setDoc(getNotebookPath(currentNb.id), { entries: currentNb.entries, name: currentNb.name }, { merge: true })
                .catch(e => console.error("Error saving entry:", e));
        }

        function handleDeleteEntry(timestamp) {
            const currentNb = getCurrentNotebook();
            if (!currentNb) return;
            
            const initialLength = currentNb.entries.length;
            
            // Filter out the entry with the matching timestamp
            currentNb.entries = currentNb.entries.filter(entry => entry.timestamp !== timestamp);
            
            if (currentNb.entries.length !== initialLength) {
                 // Push update to Firestore
                setDoc(getNotebookPath(currentNb.id), { entries: currentNb.entries, name: currentNb.name }, { merge: true })
                    .catch(e => console.error("Error deleting entry:", e));
            }
        }
        
        async function handleCreateNotebook() {
            const newName = prompt("Enter a name for the new notebook:");
            if (newName && newName.trim()) {
                const newId = `nb-${Date.now()}`;
                const newNotebook = {
                    id: newId,
                    name: newName.trim(),
                    entries: []
                };
                
                notebooks.push(newNotebook);
                currentNotebookId = newId;
                
                // Update both metadata (list) and the new document
                await saveNotebooksToFirestore(notebooks);
                renderNotebooks();
                renderEntryList();
            }
        }

        async function handleDeleteNotebook() {
            const currentNb = getCurrentNotebook();
            if (!currentNb || notebooks.length === 1) {
                alert("Cannot delete the last notebook.");
                return;
            }
            
            const confirmed = confirm(`Are you sure you want to delete the notebook: "${currentNb.name}"? This action cannot be undone.`);
            
            if (confirmed) {
                const index = notebooks.findIndex(nb => nb.id === currentNb.id);
                if (index > -1) {
                    // Remove from local list
                    notebooks.splice(index, 1);
                    
                    // Set new current notebook before saving
                    currentNotebookId = notebooks[0].id;

                    // Delete the document in Firestore
                    await deleteDoc(getNotebookPath(currentNb.id)).catch(e => console.error("Error deleting document:", e));
                    
                    // Update the list metadata (this triggers the listener)
                    await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'metadata', 'notebookList'), { list: notebooks.map(n => ({ id: n.id, name: n.name })) });
                }
            }
        }

        // --- EVENT LISTENERS ---
        notebookSelect.addEventListener('change', handleSelectNotebook);
        document.getElementById('addEntryBtn').addEventListener('click', handleAddEntry);
        document.getElementById('newEntryInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleAddEntry();
        });
        document.getElementById('createNotebookBtn').addEventListener('click', handleCreateNotebook);
        document.getElementById('deleteNotebookBtn').addEventListener('click', handleDeleteNotebook);
        signOutBtn.addEventListener('click', handleSignOut);
        signInBtn.addEventListener('click', handleGoogleSignIn);

        // --- START APP ---
        setupFirebase();
    </script>
    <style>
        .auth-gate {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
        }
        .app-container {
            max-width: 500px;
        }
        .scrollable-list {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4 sm:p-8">
    
    <div class="app-container mx-auto bg-white rounded-xl shadow-2xl p-6 relative">
        <!-- Auth Gate Screen (Sign In Prompt) -->
        <div id="authGate" class="auth-gate hidden">
            <div class="p-6 bg-white rounded-lg shadow-xl max-w-sm">
                <h3 class="text-2xl font-bold mb-4 text-indigo-600">Welcome Back!</h3>
                <p class="mb-6 text-gray-600">Please sign in to securely access your notebooks and cloud data.</p>
                
                <button id="signInBtn" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition duration-150 shadow-md flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48px" height="48px"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.158,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.096,4.671C14.17,17.152,15.821,16,17.707,16c2.51,0,4.858,1.605,5.925,3.905l5.882-6.19c-1.341-1.298-3.033-2.34-4.887-2.91C22.677,9.754,20.32,9,18,9c-4.664,0-8.877,1.868-11.97,4.961L6.306,14.691z"/><path fill="#4CAF50" d="M14.07,35.986c2.476,1.488,5.437,2.373,8.583,2.373c3.743,0,7.31-1.42,9.943-3.811l-5.753-4.305c-1.8,1.385-3.963,2.226-6.19,2.226c-3.411,0-6.402-1.637-8.381-4.046L14.07,35.986z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.126,1.066-0.672,2.072-1.503,2.868c-0.83,0.796-1.92,1.353-3.13,1.684l-5.753,4.305c3.007,2.776,7.245,4.409,11.882,4.409c5.118,0,9.954-1.66,13.27-5.068c3.315-3.409,5.006-7.859,5.006-12.871C48,15.4,45.856,12.288,43.611,20.083z"/></svg>
                    Sign In with Google
                </button>
                <p id="signInError" class="text-sm text-red-500 mt-2 min-h-[1.25rem]"></p>
            </div>
        </div>

        <!-- Main App UI -->
        <div id="appUi" class="space-y-6 hidden">
            <header class="flex justify-between items-center border-b pb-3">
                <h1 class="text-2xl font-extrabold text-gray-900">
                    <span class="text-indigo-600">#</span> Keeper
                </h1>
                <div class="flex space-x-2">
                    <button id="signOutBtn" class="bg-gray-200 text-gray-700 text-sm font-medium py-1 px-3 rounded-full hover:bg-gray-300 transition duration-150">Sign Out</button>
                </div>
            </header>

            <div id="userInfo" class="text-sm text-gray-500 bg-gray-50 p-2 rounded-lg">
                <span id="currentUserIdDisplay">Status: Connecting...</span>
                <div id="loadingIndicator" class="text-xs text-indigo-600 mt-1 hidden"></div>
            </div>

            <!-- Notebook Management -->
            <div id="notebookContainer" class="space-y-3 p-4 bg-indigo-50 rounded-lg">
                <h2 class="text-lg font-semibold text-indigo-800">Notebook Name</h2>
                <select id="notebookSelect" class="w-full p-3 border border-indigo-300 rounded-lg bg-white shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                    <!-- Options populated by JS -->
                </select>
                <div class="flex space-x-2">
                    <button id="createNotebookBtn" class="flex-1 bg-indigo-600 text-white text-sm font-medium py-2 rounded-lg hover:bg-indigo-700 transition duration-150 shadow-md">
                        + New Notebook
                    </button>
                    <button id="deleteNotebookBtn" class="flex-1 bg-red-500 text-white text-sm font-medium py-2 rounded-lg hover:bg-red-600 transition duration-150 shadow-md">
                        Delete Current
                    </button>
                </div>
            </div>

            <!-- Number Entry -->
            <div class="flex space-x-3">
                <!-- Changed to type="tel" for better mobile keyboard experience -->
                <input type="tel" id="newEntryInput" placeholder="Enter number (e.g., 45.99)"
                       class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-lg">
                <button id="addEntryBtn"
                        class="bg-green-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-green-700 transition duration-150 shadow-md">
                    Add
                </button>
            </div>

            <!-- Entry List and Summary -->
            <div class="border border-gray-200 rounded-lg">
                <div class="scrollable-list">
                    <ul id="entryList" class="p-4 divide-y divide-gray-100">
                        <!-- Entries populated by JS -->
                    </ul>
                </div>
                
                <div class="p-4 border-t bg-gray-50 flex justify-between items-center">
                    <span class="text-xl font-bold text-gray-800">TOTAL:</span>
                    <span id="totalSum" class="text-2xl font-extrabold text-indigo-600">$0.00</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
